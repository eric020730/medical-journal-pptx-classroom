name: Single PDF-to-PPTX workflow
on:
  push:
    branches: [main, 'teaching/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reject classroom and integrated-skill version drift
        run: python tools/release_version.py

  clean-install:
    name: Integrated clean install / ${{ matrix.os }} / ${{ matrix.profile }}
    needs: release-metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        profile: [minimum, latest]
        include:
          - profile: minimum
            python-version: "3.11"
          - profile: latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install, build both styles, upgrade, and uninstall
        run: python tools/check_clean_install.py --profile ${{ matrix.profile }} --report .skill-work/install-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-install-${{ matrix.os }}-${{ matrix.profile }}
          path: .skill-work/install-report.json

  bootstrap:
    name: Full rendered setup / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Setup must provision managed Python, fixed LibreOffice + Poppler and
      # complete a synthetic PPTX -> PDF -> preview render before returning 0.
      - name: Install and verify full quality pipeline (Unix)
        if: runner.os != 'Windows'
        run: |
          bash setup-codex.sh
          ./journal doctor --strict
      - name: Install and verify full quality pipeline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./setup-codex.ps1
          ./journal.cmd doctor --strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression, packaging, and repeat install (Unix)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/python -c "import pathlib,sys; assert pathlib.Path(sys.base_prefix).is_relative_to(pathlib.Path.cwd()/'.bootstrap')"
          .venv/bin/python tools/classroom.py demo
          .venv/bin/python tools/release_version.py
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python tools/package_release.py
          bash -n setup-codex.sh journal
          bash setup-codex.sh
      - name: Regression, packaging, and repeat install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $py = './.venv/Scripts/python.exe'
          & $py -c "import pathlib,sys; assert pathlib.Path(sys.base_prefix).is_relative_to(pathlib.Path.cwd()/'.bootstrap')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools/classroom.py demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools/release_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools/package_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./setup-codex.ps1
      - name: Verify shipped ZIP in a fresh folder (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir .skill-work/archive-check
          .venv/bin/python -c "import glob,zipfile; zipfile.ZipFile(glob.glob('dist/*.zip')[0]).extractall('.skill-work/archive-check')"
          cd .skill-work/archive-check/medical-journal-pptx-classroom
          bash setup-codex.sh
      - name: Verify shipped ZIP in a fresh folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName
          Expand-Archive -LiteralPath $zip -DestinationPath .skill-work/archive-check
          Set-Location .skill-work/archive-check/medical-journal-pptx-classroom
          ./setup-codex.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: medical-journal-pptx-classroom
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-result-${{ matrix.os }}
          path: .skill-work/codex-setup.json
          if-no-files-found: warn
  compatibility:
    name: Core Python ${{ matrix.python }} / Ubuntu
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python tools/classroom.py demo
      - run: python -m unittest discover -s tests -v
      - run: python tools/classroom.py smoke-test
