name: Single PDF-to-PPTX workflow
on:
  push:
    branches: [main, 'teaching/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    name: Managed Python / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # No preinstalled Python is used: bootstrap must download into .bootstrap.
      - name: Install and verify (Unix)
        if: runner.os != 'Windows'
        run: |
          bash setup-codex.sh
          ./journal doctor
      - name: Install and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./setup-codex.ps1
          ./journal.cmd doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Regression, packaging, and repeat install (Unix)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/python -c "import pathlib,sys; assert pathlib.Path(sys.base_prefix).is_relative_to(pathlib.Path.cwd()/'.bootstrap')"
          .venv/bin/python tools/classroom.py demo
          .venv/bin/python tools/release_version.py
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python tools/package_release.py
          bash -n setup-codex.sh journal
          bash setup-codex.sh
      - name: Regression, packaging, and repeat install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Tests invoke helpers directly; match journal.cmd / subprocess_environment.
        # Keep the earlier fresh-install and launcher steps on the native defaults.
        env:
          PYTHONUTF8: '1'
        run: |
          $py = './.venv/Scripts/python.exe'
          & $py -c "import pathlib,sys; assert pathlib.Path(sys.base_prefix).is_relative_to(pathlib.Path.cwd()/'.bootstrap')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools/classroom.py demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools/release_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools/package_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./setup-codex.ps1
      - name: Verify the actual ZIP in a fresh folder (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir .skill-work/archive-check
          .venv/bin/python -c "import glob,zipfile; zipfile.ZipFile(glob.glob('dist/*.zip')[0]).extractall('.skill-work/archive-check')"
          cd .skill-work/archive-check/medical-journal-pptx-classroom
          bash setup-codex.sh
      - name: Verify the actual ZIP in a fresh folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName
          Expand-Archive -LiteralPath $zip -DestinationPath .skill-work/archive-check
          Set-Location .skill-work/archive-check/medical-journal-pptx-classroom
          ./setup-codex.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: medical-journal-pptx-classroom
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-result-${{ matrix.os }}
          path: .skill-work/codex-setup.json
          if-no-files-found: warn
  compatibility:
    name: Python ${{ matrix.python }} / Ubuntu
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python tools/classroom.py demo
      - run: python -m unittest discover -s tests -v
      - run: python tools/classroom.py smoke-test
