name: Classroom cross-platform checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classroom:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q tools tests .agents/skills/medical-journal-to-pptx-classroom/scripts

      - name: Run advanced QA and image-polarity regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate repository environment
        run: python tools/classroom.py doctor

      - name: Generate the synthetic sample paper
        run: python tools/classroom.py demo

      - name: Verify image polarity, prebuild QA, and the complete PowerPoint pipeline
        run: python tools/classroom.py smoke-test

      - name: Verify privacy-safe release packaging
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python tools/classroom.py package --out dist/ci-release.zip

      - name: Parse the Windows PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "setup-windows.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Parse the macOS Bash installer
        if: runner.os == 'macOS'
        run: bash -n setup-macos.command journal
