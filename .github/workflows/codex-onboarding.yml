name: Codex URL onboarding / real managed Python
on:
  push:
    branches: ['teaching/**']
    paths:
      - 'CODEX-START.md'
      - 'setup-codex.*'
      - 'tools/codex_setup.py'
      - 'tests/test_codex_setup.py'
      - 'tools/classroom_preflight.py'
      - 'requirements.txt'
      - '.github/workflows/codex-onboarding.yml'
  pull_request:
    paths:
      - 'CODEX-START.md'
      - 'setup-codex.*'
      - 'tools/codex_setup.py'
      - 'tests/test_codex_setup.py'
      - 'tools/classroom_preflight.py'
      - 'requirements.txt'
      - '.github/workflows/codex-onboarding.yml'
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Deliberately no setup-python or package-manager installation.
      # A fresh .venv and UV_PYTHON_PREFERENCE=only-managed force downloaded Python.
      - name: Bootstrap from no project environment (Unix)
        if: runner.os != 'Windows'
        run: bash setup-codex.sh
      - name: Bootstrap from no project environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./setup-codex.ps1
      - name: Verify real managed Python and contracts (Unix)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/python -c "import sys,pathlib,json; r=pathlib.Path.cwd(); assert pathlib.Path(sys.base_prefix).is_relative_to(r/'.bootstrap'); assert json.loads((r/'.skill-work/codex-setup.json').read_text())['state']=='LOCAL_READY_SKILL_PENDING'"
          .venv/bin/python -m unittest discover -s tests -p test_codex_setup.py -v
          bash setup-codex.sh
      - name: Verify real managed Python and contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./.venv/Scripts/python.exe -c "import sys,pathlib,json; r=pathlib.Path.cwd(); assert pathlib.Path(sys.base_prefix).is_relative_to(r/'.bootstrap'); assert json.loads((r/'.skill-work/codex-setup.json').read_text())['state']=='LOCAL_READY_SKILL_PENDING'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.venv/Scripts/python.exe -m unittest discover -s tests -p test_codex_setup.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./setup-codex.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-onboarding-${{ matrix.os }}
          path: .skill-work/codex-setup.json
          if-no-files-found: warn
          retention-days: 14
